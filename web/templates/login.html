<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>登录 - Raspberry Pi Video Gateway</title>

    <style>
        :root {
            color-scheme: dark;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 20% 0%,
                    #1b3257 0%,
                    transparent 45%
                ),
                #0b1020;

            color: #edf3ff;
        }

        .login-card {
            width: min(420px, calc(100% - 32px));
            padding: 36px;

            background: #151d31;

            border: 1px solid #2b3852;
            border-radius: 18px;

            box-shadow: 0 22px 70px #0005;
        }

        .brand-icon {
            display: grid;
            place-items: center;

            width: 54px;
            height: 54px;

            margin-bottom: 24px;

            border-radius: 14px;

            background: #488cf5;

            color: white;
            font-weight: 800;
            font-size: 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 23px;
        }

        .description {
            margin: 0 0 32px;

            color: #96a5c2;
            font-size: 13px;
            line-height: 1.7;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #b1bfd6;
            font-size: 12px;
            font-weight: 600;
        }

        .field {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            height: 46px;

            padding: 0 13px;

            background: #101a2c;
            color: #edf3ff;

            border: 1px solid #2b3852;
            border-radius: 9px;

            font: inherit;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #488cf5;
        }

        button {
            width: 100%;
            height: 46px;

            margin-top: 8px;

            border: none;
            border-radius: 9px;

            background: #488cf5;
            color: white;

            font: inherit;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: #3578e2;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            min-height: 20px;

            margin-top: 18px;

            color: #fda4af;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }

        .footer {
            margin-top: 26px;

            color: #70809d;
            text-align: center;
            font-size: 11px;
        }

        .notice {
            margin-top: 16px;
            color: #a7b5cc;
            font-size: 11px;
            line-height: 1.7;
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 26px;
            }
        }
    </style>
</head>

<body>

<main class="login-card">

    <div class="brand-icon">RP</div>

    <h1>Video Gateway</h1>

    <p class="description">
        Raspberry Pi 4B 视频网关管理系统
        <br>
        请登录以管理摄像头与流媒体服务
    </p>

    <form id="loginForm">

        <div class="field">
            <label for="username">
                管理员账号
            </label>

            <input
                id="username"
                name="username"
                type="text"
                value="admin"
                autocomplete="username"
                required
            >
        </div>

        <div class="field">
            <label for="password">
                登录密码
            </label>

            <input
                id="password"
                name="password"
                type="password"
                placeholder="请输入管理员密码"
                autocomplete="current-password"
                required
            >
        </div>

        <button
            id="loginButton"
            type="submit"
        >
            登录控制台
        </button>

    </form>

    <div
        id="message"
        role="status"
        aria-live="polite"
    ></div>

    <div class="notice">
        仅限授权用户使用 · 请在可信网络中访问
    </div>

    <div class="footer">
        C++ · FFmpeg · MediaMTX · FastAPI
    </div>

</main>

<script>
"use strict";

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    button.disabled = true;
    button.textContent = "正在验证...";
    message.textContent = "";

    const username = document
        .getElementById("username").value.trim();

    const password = document
        .getElementById("password").value;

    try {
        const response = await fetch(
            "/api/auth/login",
            {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username,
                    password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail || "登录失败"
            );
        }

        window.location.replace("/");

    } catch (error) {
        message.textContent = error.message;
    } finally {
        button.disabled = false;
        button.textContent = "登录控制台";
    }
});
</script>

</body>
</html>
